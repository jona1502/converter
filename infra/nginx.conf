server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;
    client_max_body_size 101m;
    client_body_timeout 610s;
    send_timeout 30s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    # Script hashes remain in Astro's generated meta-CSP. This additional header
    # enforces framing restrictions, which cannot be expressed by a meta tag.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    error_page 404 /404.html;

    location /api/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $api_service http://api:8000;
        proxy_pass $api_service;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 620s;
        proxy_send_timeout 620s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Access logs include no queries, filenames, cookies or client IP.
        access_log off;
    }
    location / {
        try_files $uri $uri/ =404;
        access_log off;
    }
}
