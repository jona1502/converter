# Produktion auf Hetzner: /home/jona/apps/converter/docker-compose.yml
# Wird von .github/workflows/deploy.yml bei jedem Deploy auf den Server kopiert.
# Images kommen fertig aus GHCR; auf dem Server wird nichts gebaut.
#
# Pflichtwerte in /home/jona/apps/converter/.env (siehe deploy/.env.example):
#   CONVERTER_SECRET_KEY, POSTGRES_PASSWORD
# IMAGE_TAG setzt nur der Rollback-Workflow.
name: converter

x-settings: &settings
  CONVERTER_ENVIRONMENT: production
  CONVERTER_SECRET_KEY: ${CONVERTER_SECRET_KEY:?CONVERTER_SECRET_KEY fehlt in .env}
  CONVERTER_ALLOWED_ORIGINS: https://converter.muhrindustries.com
  CONVERTER_SESSION_COOKIE_SECURE: "true"
  CONVERTER_DATABASE_URL: postgres://converter:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}@db:5432/converter?sslmode=disable
  CONVERTER_REDIS_URL: redis://broker:6379/0
  CONVERTER_STORAGE_DIR: /data/storage
  CONVERTER_IP_CREATES_PER_MINUTE: ${CONVERTER_IP_CREATES_PER_MINUTE:-10}
  CONVERTER_SESSION_CREATES_PER_MINUTE: ${CONVERTER_SESSION_CREATES_PER_MINUTE:-10}
  CONVERTER_SESSION_NEW_PER_MINUTE: ${CONVERTER_SESSION_NEW_PER_MINUTE:-30}

x-service: &service
  init: true
  restart: unless-stopped
  environment: *settings
  volumes: [files:/data/storage]
  read_only: true
  tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 256m
  cpus: 1
  pids_limit: 128
  depends_on:
    db: {condition: service_healthy}
    broker: {condition: service_healthy}
    migrate: {condition: service_completed_successfully}

services:
  migrate:
    image: ghcr.io/jona1502/converter-api:${IMAGE_TAG:-latest}
    entrypoint: [/app/migrate]
    command: [up]
    environment: *settings
    restart: "no"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 1
    depends_on:
      db: {condition: service_healthy}

  api:
    <<: *service
    image: ghcr.io/jona1502/converter-api:${IMAGE_TAG:-latest}
    environment:
      <<: *settings
      # Rechts nach links: web-Container, Gateway des frontend-Netzes
      # (Host-Nginx kommt über den veröffentlichten Port von dort) und
      # Cloudflare-Edges (https://www.cloudflare.com/ips/, Stand 2026-11-15).
      # Der erste nicht vertraute Eintrag gilt als Client-IP fürs Rate-Limit.
      # Wer Cloudflare umgeht, landet selbst als nicht vertraute Gegenstelle.
      CONVERTER_TRUSTED_PROXIES: >-
        172.30.218.10/32,172.30.218.1/32,
        173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,
        141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,
        197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,
        104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,
        2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,
        2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32
    networks: {default: {}, frontend: {}}
    healthcheck:
      test: [CMD, /app/health]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 20

  worker:
    <<: *service
    image: ghcr.io/jona1502/converter-worker:${IMAGE_TAG:-latest}
    mem_limit: 1536m
    cpus: 2
    stop_grace_period: 35s

  cleanup:
    <<: *service
    image: ghcr.io/jona1502/converter-api:${IMAGE_TAG:-latest}
    entrypoint: [/app/cleanup]

  web:
    image: ghcr.io/jona1502/converter-web:${IMAGE_TAG:-latest}
    ports: ["127.0.0.1:3019:8080"]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 1
    depends_on:
      api: {condition: service_healthy}
    networks:
      frontend: {ipv4_address: 172.30.218.10}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 10s
      timeout: 3s
      retries: 5

  db:
    image: postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    restart: unless-stopped
    environment:
      POSTGRES_USER: converter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
      POSTGRES_DB: converter
    volumes: [db-data:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U converter -d converter"]
      interval: 2s
      timeout: 3s
      retries: 30

  broker:
    image: valkey/valkey:9-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    restart: unless-stopped
    command: [valkey-server, --save, "", --appendonly, "no"]
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
  files:
networks:
  frontend:
    ipam:
      config: [{subnet: 172.30.218.0/24, gateway: 172.30.218.1}]
