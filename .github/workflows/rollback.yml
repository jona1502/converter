name: Rollback

# Actions -> Rollback -> Run workflow -> vollen git-SHA eines früheren,
# funktionierenden Deploys eintragen. Zurück auf aktuell: "latest".
# Setzt IMAGE_TAG für api, worker, cleanup, migrate und web gemeinsam.
# Achtung: Datenbank-Migrationen werden dabei nicht zurückgedreht.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Voller git-SHA (40 Zeichen) eines zuvor funktionierenden Builds, oder "latest"'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-converter
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Roll back to an immutable image
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG_INPUT
          script: |
            set -eu
            cd /home/${{ secrets.SERVER_USER }}/apps/converter

            echo "$IMAGE_TAG_INPUT" | grep -Eq '^([0-9a-f]{40}|latest)$' \
              || { echo "Ungültig: voller 40-stelliger git-SHA oder 'latest' erwartet"; exit 1; }

            # Persistent in .env, damit ein manuelles "docker compose up -d"
            # nicht still auf latest zurückspringt.
            touch .env
            sed -i '/^IMAGE_TAG=/d' .env
            if [ "$IMAGE_TAG_INPUT" != "latest" ]; then
              echo "IMAGE_TAG=$IMAGE_TAG_INPUT" >> .env
            fi

            docker compose config --quiet
            docker compose pull

            if ! docker compose up -d --wait --wait-timeout 180; then
              docker compose ps -a
              docker compose logs --no-color --tail=200
              exit 1
            fi

            curl -fsS -o /dev/null -w 'origin: %{http_code}\n' http://127.0.0.1:3019/
            echo "Aktiver Tag: ${IMAGE_TAG_INPUT}"
