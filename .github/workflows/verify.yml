name: Verify converter
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CONVERTER_TEST_DATABASE_URL: postgresql://converter:converter@127.0.0.1:55432/converter_ci_test
      # A shared test IP drives hundreds of independent browser sessions.
      # Default production limits are covered separately by backend tests.
      CONVERTER_IP_CREATES_PER_MINUTE: "1000"
      CONVERTER_SESSION_CREATES_PER_MINUTE: "1000"
      CONVERTER_SESSION_NEW_PER_MINUTE: "1000"
      E2E_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.0"
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: uv sync --frozen --project backend
      - run: docker compose up -d --wait db broker
      - name: Backend static checks and integration tests
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run python scripts/export_openapi.py --check
          uv run pytest
      - run: node scripts/generate-api-types.mjs --check
      - run: npm run check
      - run: npm test
      - name: Full stack
        run: docker compose up -d --build --wait
      - name: Isolated conversion subprocess cannot create a socket
        run: |
          docker compose exec -T worker python -c "from app.worker.sandbox import isolate; import socket; isolate(1073741824,10,1000000); exec('try:\n socket.socket()\nexcept PermissionError:\n print(\"network blocked\")\nelse:\n raise SystemExit(1)')"
      - name: Real API conversion smoke
        working-directory: backend
        run: uv run python scripts/smoke_stack.py
      - run: npm run test:e2e
      - name: Failure diagnostics
        if: failure()
        run: docker compose ps; docker compose logs --tail 80
      - name: Stop containers
        if: always()
        run: docker compose down
