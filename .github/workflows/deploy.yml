name: Deploy converter (GHCR)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Deploys nie parallel und nie abbrechen: ein halber Deploy ist schlimmer
# als ein wartender.
concurrency:
  group: deploy-converter
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/jona1502/converter

jobs:
  # Gate: alle Prüfungen aus verify.yml; rot stoppt Build und Deploy.
  verify:
    uses: ./.github/workflows/verify.yml

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILD_SUMMARY: false
    strategy:
      fail-fast: true
      matrix:
        include:
          - {name: api, file: server/Dockerfile, target: runtime}
          - {name: worker, file: server/Dockerfile, target: worker}
          - {name: web, file: infra/Dockerfile.web, target: ""}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          cache-from: type=gha,scope=deploy-${{ matrix.name }}
          cache-to: type=gha,scope=deploy-${{ matrix.name }},mode=max
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Ersetzt nur docker-compose.yml; .env und Volumes bleiben unangetastet.
      - name: Copy Docker Compose configuration to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: deploy/docker-compose.yml
          strip_components: 1
          target: /home/${{ secrets.SERVER_USER }}/apps/converter
          overwrite: true

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            cd /home/${{ secrets.SERVER_USER }}/apps/converter

            # Ein Rollback setzt IMAGE_TAG in .env; der neue Deploy muss
            # wieder latest ziehen.
            if grep -q '^IMAGE_TAG=' .env 2>/dev/null; then
              sed -i '/^IMAGE_TAG=/d' .env
            fi

            docker compose config --quiet
            docker compose pull

            # migrate läuft als einmaliger Dienst vor api/worker/cleanup.
            if ! docker compose up -d --wait --wait-timeout 180; then
              docker compose ps -a
              docker compose logs --no-color --tail=200
              exit 1
            fi

            docker image prune -f

            curl -fsS -o /dev/null -w 'origin: %{http_code}\n' http://127.0.0.1:3019/
            curl -fsS -o /dev/null -w 'api ready: %{http_code}\n' http://127.0.0.1:3019/api/v1/health/ready
